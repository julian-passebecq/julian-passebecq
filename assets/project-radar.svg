  <rect x="952" y="264" width="206" height="54" rx="14" class="chip"/>
  <rect x="966" y="279" width="24" height="24" rx="7" fill="#eef7fb"/>
  <ellipse cx="978" cy="286" rx="7" ry="3" fill="#0b7fca"/>
  <path d="M971 286v10c0 2 3 4 7 4s7-2 7-4v-10" fill="#0b7fca"/>
  <text x="1002" y="285" font-size="12" font-weight="700" fill="#425c67">Analyst / Data</text>
