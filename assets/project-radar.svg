<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Julian Passebecq project radar</title>
  <desc id="desc">Static GitHub profile preview of a data, BI and cloud project portfolio. Click the image in the README to open the interactive portfolio.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16303d" flood-opacity="0.09"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#16303d" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafb"/>
      <stop offset="1" stop-color="#eef3f5"/>
    </linearGradient>
    <linearGradient id="mlg" x1="155" y1="170" x2="224" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="dbg" x1="165" y1="405" x2="215" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f8acb"/>
      <stop offset="1" stop-color="#255b8c"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { fill:#17242c; font-weight:700; font-size:20px; }
      .sub { fill:#82939c; font-weight:700; font-size:10px; letter-spacing:1.4px; }
      .small { fill:#607680; font-size:11px; }
      .node { fill:#ffffff; stroke:#cfdbdf; stroke-width:1.5; filter:url(#soft); }
      .line { fill:none; stroke:#bfd0d7; stroke-width:1.35; }
      .guide { fill:none; stroke:#e1e9ec; stroke-width:1; }
      .route-blue { stroke:#7fa6b8; }
      .route-green { stroke:#84a79a; }
      .dot-blue { fill:#4f8096; }
      .dot-green { fill:#6f9386; }
      .chip { fill:#f6f9fa; stroke:#dce6e9; stroke-width:1; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="885" height="610" rx="24" fill="#fff" stroke="#dce5e8" filter="url(#shadow)"/>

  <circle cx="455" cy="325" r="245" class="line"/>
  <polygon points="455,150 607,238 607,412 455,500 303,412 303,238" class="guide"/>
  <polygon points="455,205 559,265 559,385 455,445 351,385 351,265" class="guide"/>
  <polygon points="455,250 520,288 520,362 455,400 390,362 390,288" class="guide"/>

  <line x1="455" y1="145" x2="455" y2="276" class="line route-blue"/>
  <line x1="685" y1="238" x2="501" y2="290" class="line route-blue"/>
  <line x1="685" y1="412" x2="510" y2="362" class="line route-green"/>
