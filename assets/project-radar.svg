<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Julian Passebecq project radar</title>
  <desc id="desc">Lightweight animated profile radar covering cloud architecture, machine learning, SQL and data engineering, BI, Microsoft cloud news, developer tooling and D3 visual data.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17313d" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b63b6"/>
      <stop offset="1" stop-color="#35b7e8"/>
    </linearGradient>
    <linearGradient id="ml" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3776ab"/>
      <stop offset="1" stop-color="#27ae60"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .label { fill:#17242c; font-size:14px; font-weight:700; }
      .sub { fill:#8798a1; font-size:8.5px; font-weight:700; letter-spacing:1.1px; }
      .node { fill:#fff; stroke:#d3dfe3; stroke-width:1.4; filter:url(#soft); }
      .guide { fill:none; stroke:#e7edef; stroke-width:1; }
      .route { fill:none; stroke:#b8cbd3; stroke-width:1.45; }
      .routeGreen { stroke:#91aea3; }
      .packet { fill:#4f8096; filter:url(#soft); }
      .packetGreen { fill:#6f9487; }
      .role { fill:#fff; stroke:#d3dfe3; stroke-width:1.1; filter:url(#soft); }
      .airflow { transform-box: fill-box; transform-origin:center; animation:spin 4.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .airflow { animation:none; } }
    </style>
  </defs>

  <rect x="8" y="8" width="904" height="484" rx="24" fill="#ffffff" stroke="#e0e8eb"/>

  <!-- lightweight radar guides -->
  <circle cx="460" cy="250" r="186" class="route"/>
  <polygon points="460,115 577,183 577,317 460,385 343,317 343,183" class="guide"/>
  <polygon points="460,160 538,205 538,295 460,340 382,295 382,205" class="guide"/>
  <polygon points="460,197 507,224 507,276 460,303 413,276 413,224" class="guide"/>

  <!-- project routes -->
  <path id="r1" d="M460 92 L460 196" class="route"/>
  <path id="r2" d="M657 160 L500 205" class="route"/>
  <path id="r3" d="M657 340 L500 295" class="route routeGreen"/>
  <path id="r4" d="M460 410 L500 302" class="route routeGreen"/>
  <path id="r5" d="M263 340 L420 295" class="route"/>
  <path id="r6" d="M263 160 L420 295" class="route"/>

  <!-- animated packets; GitHub can render native SVG animation in browsers, while static clients simply show the radar -->
  <circle r="3.2" class="packet"><animateMotion dur="4.1s" repeatCount="indefinite" path="M460 92 L460 196"/></circle>
  <circle r="3.2" class="packet"><animateMotion dur="4.6s" begin="-1.4s" repeatCount="indefinite" path="M657 160 L500 205"/></circle>
  <circle r="3.2" class="packet packetGreen"><animateMotion dur="4.4s" begin="-.7s" repeatCount="indefinite" path="M657 340 L500 295"/></circle>
  <circle r="3.2" class="packet packetGreen"><animateMotion dur="4.8s" begin="-2s" repeatCount="indefinite" path="M460 410 L500 302"/></circle>
  <circle r="3.2" class="packet"><animateMotion dur="4.5s" begin="-2.7s" repeatCount="indefinite" path="M263 340 L420 295"/></circle>
  <circle r="3.2" class="packet"><animateMotion dur="4.7s" begin="-1.8s" repeatCount="indefinite" path="M263 160 L420 295"/></circle>

  <!-- 03 Architecture / Azure -->
  <circle cx="460" cy="64" r="38" class="node"/>
  <path d="M449 87 L463 41 L477 87 L468 87 L463 75 L454 75 L450 87Z" fill="url(#azure)"/>
  <path d="M463 41 L477 87 L470 87 L457 68Z" fill="#2eb4e6" opacity=".9"/>
  <text x="460" y="113" text-anchor="middle" class="label">Architecture Web</text>
  <text x="460" y="127" text-anchor="middle" class="sub">CLOUD ARCHITECTURE</text>

  <!-- 06 Developer watch -->
  <circle cx="697" cy="150" r="38" class="node"/>
  <rect x="677" y="132" width="40" height="36" rx="8" fill="#eff7fd"/>
  <path d="M687 142 l-9 8 9 8 M707 142 l9 8-9 8" fill="none" stroke="#0877c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M702 137 l-10 26" stroke="#36a9e1" stroke-width="2.4" stroke-linecap="round"/>
  <text x="697" y="200" text-anchor="middle" class="label">Code Updates Site</text>
  <text x="697" y="214" text-anchor="middle" class="sub">DEVELOPER WATCH</text>

  <!-- 04 Microsoft cloud news -->
  <circle cx="697" cy="350" r="38" class="node"/>
  <rect x="681" y="334" width="14" height="14" fill="#f35325"/>
  <rect x="699" y="334" width="14" height="14" fill="#81bc06"/>
  <rect x="681" y="352" width="14" height="14" fill="#05a6f0"/>
  <rect x="699" y="352" width="14" height="14" fill="#ffba08"/>
  <text x="697" y="400" text-anchor="middle" class="label">Microsoft / Cloud News</text>
  <text x="697" y="414" text-anchor="middle" class="sub">PRODUCT WATCH</text>

  <!-- 01 D3 visual data -->
  <circle cx="460" cy="436" r="38" class="node"/>
  <text x="460" y="444" text-anchor="middle" font-size="24" font-weight="800" fill="#ef7d43">D3</text>
  <text x="460" y="482" text-anchor="middle" class="label">D3 Eco Site</text>

  <!-- 05 SQL / data-engineering trainer -->
  <circle cx="223" cy="350" r="38" class="node"/>
  <ellipse cx="215" cy="338" rx="13" ry="5" fill="#d9eef8" stroke="#2c789c" stroke-width="2"/>
  <path d="M202 338v19c0 4 6 7 13 7s13-3 13-7v-19" fill="#27759a" opacity=".94"/>
  <rect x="216" y="345" width="25" height="19" rx="5" fill="#fff" stroke="#5d7d8b" stroke-width="2"/>
  <path d="M224 350l-4 4 4 4M233 350l4 4-4 4" fill="none" stroke="#2f80ed" stroke-width="2" stroke-linecap="round"/>
  <text x="223" y="400" text-anchor="middle" class="label">SQL Trainer</text>
  <text x="223" y="414" text-anchor="middle" class="sub">SQL · DATA ENGINEERING</text>

  <!-- 02 ML / Data Science: neutral model icon, not a library logo -->
  <circle cx="223" cy="150" r="38" class="node"/>
  <circle cx="210" cy="140" r="4.5" fill="#3776ab"/>
  <circle cx="210" cy="160" r="4.5" fill="#3776ab"/>
  <circle cx="224" cy="132" r="4.5" fill="#56ccf2"/>
  <circle cx="224" cy="150" r="4.5" fill="#2f80ed"/>
  <circle cx="224" cy="168" r="4.5" fill="#56ccf2"/>
  <circle cx="239" cy="150" r="5" fill="#27ae60"/>
  <path d="M214 140l6-6M214 140l6 9M214 160l6-9M214 160l6 6M228 132l7 15M228 150h6M228 168l7-15" stroke="#6d8792" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M207 173l9-7 8 4 10-10 9 5" fill="none" stroke="url(#ml)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="223" y="200" text-anchor="middle" class="label">ML / Data Science</text>
  <text x="223" y="214" text-anchor="middle" class="sub">PYTHON · ML</text>

  <!-- center competency nodes -->
  <rect x="441" y="181" width="38" height="38" rx="12" class="role"/>
  <path d="M450 211 L461 188 L472 211 L466 211 L461 201 L456 211Z" fill="#0877c9"/>

  <rect x="392" y="286" width="38" height="38" rx="12" class="role"/>
  <ellipse cx="411" cy="297" rx="10" ry="4" fill="#0b7fca"/>
  <path d="M401 297v12c0 3 4 5 10 5s10-2 10-5v-12" fill="#0b7fca" opacity=".9"/>
  <text x="411" y="309" text-anchor="middle" font-size="6.8" fill="#fff" font-weight="700">SQL</text>

  <rect x="490" y="286" width="38" height="38" rx="12" class="role"/>
  <rect x="500" y="302" width="5" height="10" rx="1.5" fill="#f2c811"/>
  <rect x="507" y="296" width="5" height="16" rx="1.5" fill="#e7b40f"/>
  <rect x="514" y="290" width="5" height="22" rx="1.5" fill="#d99b00"/>

  <!-- portfolio core -->
  <circle cx="460" cy="258" r="34" class="node"/>
  <rect x="441" y="249" width="38" height="24" rx="4" fill="none" stroke="#315666" stroke-width="2.6"/>
  <path d="M449 249v-6c0-5 4-8 9-8h4c5 0 9 3 9 8v6" fill="none" stroke="#315666" stroke-width="2.6"/>
  <path d="M441 258c10 5 28 5 38 0" fill="none" stroke="#315666" stroke-width="1.8"/>
  <rect x="457" y="257" width="7" height="5" rx="1" fill="#315666"/>
  <text x="460" y="306" text-anchor="middle" class="label" font-size="12.5">Portfolio</text>

  <!-- Airflow accent -->
  <g class="airflow">
    <path d="M460 331 L455 317 Q460 313 465 317 L462 331Z" fill="#00a6c7"/>
    <path d="M462 333 L476 328 Q480 333 476 338 L462 335Z" fill="#2468a2"/>
    <path d="M460 335 L465 349 Q460 353 455 349 L458 335Z" fill="#48a16f"/>
    <path d="M458 333 L444 338 Q440 333 444 328 L458 331Z" fill="#d95c5c"/>
    <circle cx="460" cy="333" r="3.4" fill="#fff" stroke="#526f7b"/>
  </g>
</svg>
