  <line x1="225" y1="412" x2="397" y2="360" class="line route-blue"/>
  <line x1="225" y1="238" x2="398" y2="356" class="line route-blue"/>

  <circle cx="455" cy="216" r="3.5" class="dot-blue"/>
  <circle cx="455" cy="252" r="3.5" class="dot-blue"/>
  <circle cx="588" cy="266" r="3.5" class="dot-blue"/>
